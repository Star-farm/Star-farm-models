# Profit (recompense par ferme) entraine sur la NOUVELLE province, carte simplifiee.
#
# Troisieme controle de la serie. Profit est la seule politique du sweep qui transfere
# (+36,1 k€/ferme sur Dong Thap simplifiee, au-dessus de la baseline), mais elle y perd ~40 %
# par rapport a sa carte d'origine. Entrainee sur place, recupere-t-elle cet ecart ?
#
# Hyperparametres IDENTIQUES a config_mappo3_peragent.yaml, graine 0 comprise : la province
# est la seule variable, sinon la comparaison ne conclut rien.

checkpoint:
  dir: saved_models_mappo3_dtnew_profit
  filename: starfarm_ippo.pth
  resume: true
  rewards_log: episode_rewards.json
  save_every: 10

gama:
  controler_path: C:/Users/ktrou/Documents/Work & Internships/Starfarm/STAR FARM/models/Experiments/ReinforcementLearning.gaml
  experiment_name: marl
  ip_address: localhost
  port: 1001
  province: Dong Thap
  simple_spatial_data: true
  max_days_per_year: 2000
  min_days_per_year: 340
  substep_days: 122
  year_end_margin: 3

training:
  algo: mappo
  clip_eps: 0.2
  critic_hidden_dim: 256
  entropy_coef: 0.01
  entropy_coef_final: 0.001
  eval_every: 25
  gae_lambda: 0.95
  gamma: 0.97
  hidden_dim: 128
  k_epochs: 4
  lr: 0.0003
  minibatch_size: 64
  normalize_obs: true
  num_episodes: 400
  reward_mode: per_agent
  reward_scale: 1.0e-06
  seed: 0
  sequential_decisions: true
  target_kl: 0.03
  value_coef: 0.5
  verbose: false
