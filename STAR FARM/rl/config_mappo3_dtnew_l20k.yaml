# Entrainement de Bal-20k sur la NOUVELLE province (Dong Thap simplifiee, 10 fermes).
#
# But : separer "la politique ne transfere pas" de "la carte est plus dure". Bal-20k est la
# 2e meilleure sur sa carte d'origine (+26,9k au-dessus de la baseline) mais s'effondre sur
# Dong Thap simplifiee (-1,7k, sous la baseline). Entrainee DIRECTEMENT dessus, elle devrait
# retrouver une marge confortable -- sinon, c'est la carte elle-meme qui est le probleme.
#
# SEED 0 et hyperparametres identiques a config_mappo3_balanced.yaml : la province est la
# SEULE variable qui change, sinon la comparaison ne conclut rien.
#
# Carte SIMPLIFIEE (10 fermes) : c'est l'echelle d'entrainement de tout le sweep. La carte
# complete (992 fermes) coute ~60 min par episode, soit des semaines pour 400 episodes.

checkpoint:
  dir: saved_models_mappo3_dtnew_l20k
  filename: starfarm_ippo.pth
  resume: true
  rewards_log: episode_rewards.json
  save_every: 10

gama:
  controler_path: C:/Users/ktrou/Documents/Work & Internships/Starfarm/STAR FARM/models/Experiments/ReinforcementLearning.gaml
  experiment_name: marl
  ip_address: localhost
  port: 1002
  province: Dong Thap
  simple_spatial_data: true
  max_days_per_year: 2000
  min_days_per_year: 340
  substep_days: 122
  year_end_margin: 3

training:
  algo: mappo
  clip_eps: 0.2
  critic_hidden_dim: 256
  entropy_coef: 0.01
  entropy_coef_final: 0.001
  eval_every: 25
  gae_lambda: 0.95
  gamma: 0.97
  hidden_dim: 128
  k_epochs: 4
  lr: 0.0003
  minibatch_size: 64
  normalize_obs: true
  num_episodes: 400
  reward_mode: balanced
  balance_weight: 20000.0
  reward_scale: 1.0e-06
  seed: 0
  sequential_decisions: true
  target_kl: 0.03
  value_coef: 0.5
  verbose: false
